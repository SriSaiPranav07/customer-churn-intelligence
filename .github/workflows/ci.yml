name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest tests -v --tb=short

      - name: Train models (if artifacts missing)
        run: |
          if [ ! -f models/champion_model.joblib ]; then
            echo "Model artifacts missing – triggering training..."
            python src/train.py
          else
            echo "Model artifacts present – skipping training."
          fi
